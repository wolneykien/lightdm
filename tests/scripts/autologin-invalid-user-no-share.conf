#
# Check a failed autologin starts the greeter on a separate X server
#

[Seat:*]
autologin-user=invalid
user-session=default
xserver-share=false
allow-user-switching=false

[test-pam]
log-events=true

#?*START-DAEMON
#?RUNNER DAEMON-START

# X server starts
#?XSERVER-0 START VT=7 SEAT=seat0

# Daemon connects when X server is ready
#?*XSERVER-0 INDICATE-READY
#?XSERVER-0 INDICATE-READY
#?XSERVER-0 ACCEPT-CONNECT

#?PAM-invalid START SERVICE=lightdm-autologin USER=invalid
#?PAM-invalid AUTHENTICATE
#?PAM-invalid END

# The failed session releases its server. The greeter gets a new one.
#?XSERVER-0 TERMINATE SIGNAL=15
#?XSERVER-1 START VT=8 SEAT=seat0
#?*XSERVER-1 INDICATE-READY
#?XSERVER-1 INDICATE-READY
#?XSERVER-1 ACCEPT-CONNECT

# Greeter starts
#?PAM-lightdm START SERVICE=lightdm-greeter USER=lightdm
#?PAM-lightdm SETCRED ESTABLISH_CRED
#?PAM-lightdm OPEN-SESSION
#?GREETER-X-1 START XDG_SEAT=seat0 XDG_VTNR=8 XDG_SESSION_CLASS=greeter
#?LOGIN1 ACTIVATE-SESSION SESSION=c0
#?VT ACTIVATE VT=8
#?XSERVER-1 ACCEPT-CONNECT
#?GREETER-X-1 CONNECT-XSERVER
#?GREETER-X-1 CONNECT-TO-DAEMON
#?GREETER-X-1 CONNECTED-TO-DAEMON
#?GREETER-X-1 SELECT-USER-HINT USERNAME=invalid

# Cleanup
#?*STOP-DAEMON
#?GREETER-X-1 TERMINATE SIGNAL=15
#?PAM-lightdm CLOSE-SESSION
#?PAM-lightdm SETCRED DELETE_CRED
#?PAM-lightdm END
#?XSERVER-1 TERMINATE SIGNAL=15
#?RUNNER DAEMON-EXIT STATUS=0
